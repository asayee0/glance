- name: Startpage
  width: slim
  hide-desktop-navigation: true
  center-vertically: true
  columns:
    - size: full
      widgets:
        - type: search
          autofocus: true

        - type: monitor
          cache: 1m
          title: Services
          sites:
            - title: Plex
              url: https://plex.tv/
              icon: si:plex
            - title: GitHub
              url: https://github.com/
              icon: si:github
            - title: Transmission
              url: https://transmissionbt.com/
              icon: si:transmission
            - title: Nextcloud
              url: https://nextcloud.com/
              icon: si:nextcloud
            - title: Pi-hole
              url: https://pi-hole.net/
              icon: si:pihole
            - title: Bitwarden
              url: https://bitwarden.com/
              icon: si:bitwarden

        - type: bookmarks
          groups:
            - title: General
              links:
                - title: Gmail
                  url: https://mail.google.com/mail/u/0/
                - title: Amazon
                  url: https://www.amazon.com/
                - title: Github
                  url: https://github.com/
            - title: Entertainment
              links:
                - title: YouTube
                  url: https://www.youtube.com/
                - title: Prime Video
                  url: https://www.primevideo.com/
                - title: Disney+
                  url: https://www.disneyplus.com/
            - title: Social
              links:
                - title: Reddit
                  url: https://www.reddit.com/
                - title: Twitter
                  url: https://twitter.com/
                - title: Instagram
                  url: https://www.instagram.com/